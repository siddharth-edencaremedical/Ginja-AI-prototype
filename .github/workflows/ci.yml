name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve affected range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            base="$head"
          fi

          echo "NX_BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "NX_HEAD_SHA=$head" >> "$GITHUB_ENV"

      - name: Lint, typecheck, and build affected projects
        shell: bash
        run: |
          changed_files="$(git diff --name-only "$NX_BASE_SHA" "$NX_HEAD_SHA")"

          if printf '%s\n' "$changed_files" | grep -qx 'eslint.config.mjs'; then
            pnpm lint
            pnpm exec nx affected -t typecheck build --base="$NX_BASE_SHA" --head="$NX_HEAD_SHA" --outputStyle=static
          else
            pnpm exec nx affected -t lint typecheck build --base="$NX_BASE_SHA" --head="$NX_HEAD_SHA" --outputStyle=static
          fi
